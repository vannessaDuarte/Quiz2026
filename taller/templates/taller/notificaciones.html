{% extends 'core/base.html' %}
{% block contenido %}
<h1 class="h3 mb-3">Notificaciones</h1>
<div class="list-group">
{% for n in notificaciones %}
  <div class="list-group-item d-flex justify-content-between align-items-start {% if not n.leida %}list-group-item-warning{% endif %}">
    <div>{{ n.mensaje }}
      {% if n.orden_id %}<a class="ms-2 small" href="{% url 'ordenes:detalle' n.orden_id %}">Ver orden #{{ n.orden_id }}</a>{% endif %}</div>
    <small class="text-muted text-nowrap ms-3">{{ n.creada|date:"d/m H:i" }}</small>
  </div>
{% empty %}<div class="list-group-item text-muted">Sin notificaciones.</div>{% endfor %}
</div>
{% endblock %}
