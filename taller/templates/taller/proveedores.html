{% extends 'core/base.html' %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Proveedores</h1>
  <a class="btn btn-primary" href="{% url 'taller:proveedor_nuevo' %}">+ Nuevo proveedor</a>
</div>
<div class="table-responsive"><table class="table bg-white">
  <thead><tr><th>Nombre</th><th>RUT</th><th>Teléfono</th><th>Correo</th><th>Repuestos</th></tr></thead>
  <tbody>
  {% for p in proveedores %}<tr><td>{{ p.nombre }}</td><td>{{ p.rut }}</td><td>{{ p.telefono }}</td><td>{{ p.email }}</td><td>{{ p.n }}</td></tr>
  {% empty %}<tr><td colspan="5" class="text-muted">Sin proveedores.</td></tr>{% endfor %}
  </tbody></table></div>
{% endblock %}
