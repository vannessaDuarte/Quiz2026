{% extends 'core/base.html' %}
{% block contenido %}
<h1 class="h3 mb-3">Vehículos</h1>
<div class="table-responsive"><table class="table table-hover bg-white">
  <thead><tr><th>Patente</th><th>Vehículo</th><th>Cliente</th><th>Órdenes</th><th></th></tr></thead>
  <tbody>
  {% for v in vehiculos %}
    <tr><td>{{ v.patente }}</td><td>{{ v.marca }} {{ v.modelo }}</td><td>{{ v.cliente.nombre }}</td><td>{{ v.n_ordenes }}</td>
        <td><a class="btn btn-sm btn-outline-primary" href="{% url 'clientes:vehiculo_detalle' v.pk %}">Detalle</a></td></tr>
  {% empty %}<tr><td colspan="5" class="text-muted">Sin vehículos.</td></tr>{% endfor %}
  </tbody></table></div>
{% endblock %}
